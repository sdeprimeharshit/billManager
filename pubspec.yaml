name: bill_manager
description: A GST-compliant billing application for Windows and macOS.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0+2
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  pdf: ^3.10.7
  printing: ^5.11.1
  intl: ^0.19.0
  window_manager: ^0.3.7
  cupertino_icons: ^1.0.6

dev_dependencies:
  msix: ^3.16.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

msix_config:
  display_name: Bill Manager
  publisher_display_name: SDE Prime
  identity_name: com.sdeprime.billmanager
  msix_version: 1.0.0.0
  capabilities: internetClient, location
  install_certificate: false